name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # версію pnpm бере з поля packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm vite build
